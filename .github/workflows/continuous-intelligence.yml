name: GPIR Continuous Intelligence Discovery

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpir-continuous-intelligence
  cancel-in-progress: false

jobs:
  propose-candidates:
    name: Discover trusted-source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reuse an open proposal branch when present
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/intelligence-candidates >/dev/null 2>&1; then
            git fetch origin automation/intelligence-candidates
            git switch --track -c automation/intelligence-candidates origin/automation/intelligence-candidates
          fi

      - name: Discover proposal-only intelligence candidates
        shell: bash
        run: |
          set -o pipefail
          node scripts/propose-intelligence-candidates.js | tee "$RUNNER_TEMP/intelligence-proposal-report.json"

      - name: Report source coverage and health
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/intelligence-proposal-report.json" ]; then
            {
              echo "## GPIR intelligence discovery report"
              echo '```json'
              cat "$RUNNER_TEMP/intelligence-proposal-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## GPIR intelligence discovery report" >> "$GITHUB_STEP_SUMMARY"
            echo "Discovery did not produce a report; public GPIR content was not changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate a changed candidate queue
        id: candidate_change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/intelligence-candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/validate-content.js
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push the proposal branch
        if: steps.candidate_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git branch --show-current)" = "main" ]; then
            git switch -c automation/intelligence-candidates
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/intelligence-candidates.json
          git commit -m "M-21 Propose trusted intelligence candidates"
          git push origin HEAD:automation/intelligence-candidates

      - name: Create a proposal pull request when needed
        if: steps.candidate_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr list --head automation/intelligence-candidates --base main --state open --json number --jq 'length > 0' | grep -qx true; then
            echo "Updated existing candidate proposal pull request."
          else
            gh pr create \
              --base main \
              --head automation/intelligence-candidates \
              --title "M-21 Propose trusted intelligence candidates" \
              --body "Automated M-21 discovery found new trusted-source candidates. These records are DEVELOPING, NOT_PUBLISHED and require human review; no public GPIR publication was changed."
          fi
