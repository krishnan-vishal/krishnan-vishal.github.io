name: GPIR Continuous Intelligence Discovery

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpir-continuous-intelligence
  cancel-in-progress: false

jobs:
  propose-candidates:
    name: Discover trusted-source candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reuse an open proposal branch when present
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/intelligence-candidates >/dev/null 2>&1; then
            git fetch origin automation/intelligence-candidates
            git show origin/automation/intelligence-candidates:assets/data/intelligence-candidates.json > "$RUNNER_TEMP/retained-intelligence-candidates.json"
            git show origin/automation/intelligence-candidates:assets/data/announcements.json > "$RUNNER_TEMP/retained-announcements.json"
            git show origin/automation/intelligence-candidates:assets/data/content-registry.json > "$RUNNER_TEMP/retained-content-registry.json"
            git switch -c automation/intelligence-candidates
            # Join the existing proposal branch history while retaining the
            # reviewed main tree; the queue is reconciled explicitly below.
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-ff -s ours --no-edit origin/automation/intelligence-candidates
            node scripts/merge-intelligence-candidate-queues.js "$RUNNER_TEMP/retained-intelligence-candidates.json" "$RUNNER_TEMP/retained-announcements.json" "$RUNNER_TEMP/retained-content-registry.json"
          fi

      - name: Discover proposal-only intelligence candidates
        shell: bash
        run: |
          set -o pipefail
          node scripts/propose-intelligence-candidates.js --health-output=assets/data/source-health.json | tee "$RUNNER_TEMP/intelligence-proposal-report.json"

      - name: Apply deterministic Tier-1 publication gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-intelligence-candidates.js | tee "$RUNNER_TEMP/intelligence-publication-report.json"
          node scripts/generate-intelligence-pages.js

      - name: Report source coverage and health
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/intelligence-proposal-report.json" ]; then
            {
              echo "## GPIR intelligence discovery report"
              echo '```json'
              cat "$RUNNER_TEMP/intelligence-proposal-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## GPIR intelligence discovery report" >> "$GITHUB_STEP_SUMMARY"
            echo "Discovery did not produce a report; public GPIR content was not changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate changed intelligence artifacts
        id: candidate_change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/intelligence-candidates.json assets/data/announcements.json assets/data/content-registry.json assets/data/source-health.json pages/intelligence sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/validate-content.js
          node scripts/validate-announcements.js
          node scripts/test-announcement-lifecycle.js
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push the proposal branch
        if: steps.candidate_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git branch --show-current)" = "main" ]; then
            git switch -c automation/intelligence-candidates
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/intelligence-candidates.json assets/data/announcements.json assets/data/content-registry.json assets/data/source-health.json pages/intelligence sitemap.xml
          git commit -m "Global Announcements refresh source-to-intelligence pipeline"
          git push origin HEAD:automation/intelligence-candidates

      - name: Create a proposal pull request when needed
        if: steps.candidate_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          if gh pr list --head automation/intelligence-candidates --base main --state open --json number --jq 'length > 0' | grep -qx true; then
            echo "Updated existing candidate proposal pull request."
            exit 0
          fi
          # The candidate branch above is already pushed and is real,
          # human-reviewable output regardless of what happens below --
          # opening the PR is a convenience wrapper around it, not the
          # discovery/validation work itself. A repository whose Settings >
          # Actions > General > Workflow permissions does not have "Allow
          # GitHub Actions to create and approve pull requests" enabled
          # will reject PR creation from this token; that is a repository
          # setting, not a discovery/validation failure, so it must not
          # fail the whole scheduled run (which would make every run look
          # like discovery itself is broken and leave the reader-facing
          # freshness status looking permanently stale).
          if gh pr create \
            --base main \
            --head automation/intelligence-candidates \
            --title "Global Announcements automated intelligence refresh" \
            --body "Deterministic source discovery, Tier-1 validation, canonical intelligence generation and source-health updates. Association/discovery sources remain queued for review. Main is unchanged until owner review and merge."; then
            exit 0
          fi
          echo "::warning::Candidate discovery succeeded and pushed automation/intelligence-candidates, but this token could not open the pull request (commonly: Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\" is disabled for this repository). Open the PR manually from that branch, or enable that setting, to complete human review."
          echo "## GPIR candidate branch pushed, PR not auto-created" >> "$GITHUB_STEP_SUMMARY"
          echo "automation/intelligence-candidates was pushed with new candidates, but this token is not permitted to open pull requests. Open it manually, or enable Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\"." >> "$GITHUB_STEP_SUMMARY"
