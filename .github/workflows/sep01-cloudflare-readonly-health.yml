name: GPIR Cloudflare read-only health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'krishnan-vishal/krishnan-vishal.github.io' && github.actor == 'krishnan-vishal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: payload-production-cutover
    timeout-minutes: 3
    steps:
      - name: Verify existing Workers through authenticated GET only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          [[ "$CF_ACCOUNT" =~ ^[a-fA-F0-9]{32}$ ]]
          for worker in gpir-payload-cms krishnan-vishal-github-io; do
            result=$(mktemp)
            trap 'rm -f "$result"' EXIT
            status=$(curl --silent --show-error --max-time 20 --proto '=https' --request GET --header "Authorization: Bearer $CF_TOKEN" --output "$result" --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$worker/settings")
            if [[ "$status" == 200 ]] && jq -e '.success == true and (.result | type == "object")' "$result" >/dev/null; then
              echo "$worker: authenticated settings read HTTP 200" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$worker: provider verification failed HTTP $status" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            rm -f "$result"
          done
