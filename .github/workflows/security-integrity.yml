name: GPIR Security and Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-integrity:
    name: Validate security and content integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate structured content
        run: node scripts/validate-content.js

      - name: Test intelligence discovery contracts
        run: node scripts/test-intelligence-radar.js

      - name: Validate source coverage reports
        run: |
          node scripts/validate-source-coverage.js
          node scripts/validate-wave-a-coverage.js

      - name: Test M29 and Wave A acquisition contracts
        run: node scripts/test-m29-source-network.js

      - name: Test M30 Global Announcements production closure
        run: |
          node scripts/test-m30-global-announcements.js
          node scripts/test-production-announcement-pipeline.js
          node scripts/test-continuous-intelligence-recovery.js

      - name: Validate internal HTML links
        run: node scripts/validate-links.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets/js scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Scan for high-confidence secret patterns
        run: node scripts/scan-high-confidence-secrets.js
