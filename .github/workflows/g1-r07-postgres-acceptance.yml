name: G1 R07 PostgreSQL acceptance
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/g1-r07-postgres-acceptance.mjs'
      - 'tests/fixtures/g1-r07-postgres-schema.sql'
      - '.github/workflows/g1-r07-postgres-acceptance.yml'
  workflow_dispatch:
jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute migration and acceptance tests
        run: node tests/g1-r07-postgres-acceptance.mjs
