name: GPIR Drive editorial import
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpir-contentful-bcp
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'krishnan-vishal/krishnan-vishal.github.io' && github.ref == 'refs/heads/main' && github.actor == 'krishnan-vishal'
    runs-on: ubuntu-latest
    environment: payload-production-cutover
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/gpir-cms
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - name: Acquire and reconcile Drive content and create native editorial drafts
        env:
          GPIR_DRIVE_INTAKE_MANIFEST: ${{ secrets.GPIR_DRIVE_INTAKE_MANIFEST }}
          GPIR_DRIVE_CLIENT_ID: ${{ secrets.GPIR_DRIVE_CLIENT_ID }}
          GPIR_DRIVE_CLIENT_SECRET: ${{ secrets.GPIR_DRIVE_CLIENT_SECRET }}
          GPIR_DRIVE_REFRESH_TOKEN: ${{ secrets.GPIR_DRIVE_REFRESH_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          PAYLOAD_DATABASE_URI: ${{ secrets.PAYLOAD_DATABASE_URI }}
          PAYLOAD_DATABASE_CA_CERT: ${{ secrets.PAYLOAD_DATABASE_CA_CERT }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION || secrets.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: npx --no-install tsx src/migration/import-drive-editorial.ts
