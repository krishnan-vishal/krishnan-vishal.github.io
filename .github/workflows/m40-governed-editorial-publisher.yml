name: M40 governed editorial publisher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      registration_entry_id:
        description: 'Optional unpublished Contentful entry ID to register for identity review only'
        type: string

permissions:
  contents: read

concurrency:
  group: m40-governed-editorial-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gpir-editorial-publisher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run existing governed publication processor
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registration_entry_id == '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GPIR_SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.GPIR_SUPABASE_PUBLISHABLE_KEY }}
          GPIR_EDITORIAL_PUBLISHER_JWT: ${{ secrets.GPIR_EDITORIAL_PUBLISHER_JWT }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
        run: node scripts/m40/run-editorial-publisher.mjs
      - name: Register one unpublished editorial draft for identity review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.registration_entry_id != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GPIR_SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.GPIR_SUPABASE_PUBLISHABLE_KEY }}
          GPIR_EDITORIAL_PUBLISHER_JWT: ${{ secrets.GPIR_EDITORIAL_PUBLISHER_JWT }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          GPIR_EDITORIAL_OPERATION: register-draft
          GPIR_REGISTER_DRAFT_ENTRY_ID: ${{ inputs.registration_entry_id }}
        run: node scripts/m40/run-editorial-publisher.mjs
