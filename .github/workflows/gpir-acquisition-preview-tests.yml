name: GPIR acquisition preview tests
on:
  pull_request:
    paths:
      - 'scripts/intelligence/cloudflare-acquisition-*'
      - '.github/workflows/gpir-acquisition-preview-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/intelligence/cloudflare-acquisition-preview.test.mjs
