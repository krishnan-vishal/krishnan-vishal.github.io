name: M36 CL-03C read-only canonical route readback

on:
  push:
    branches:
      - m36-cl03c-canonical-route-reconciliation
    paths:
      - .github/workflows/m36-cl03c-route-readback.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type M36-CL-03C-READ-ONLY to authorize GET-only route readback
        required: true
        type: string

permissions:
  contents: read

jobs:
  read-five-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: contentful-production
    env:
      CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
      OWNER_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4

      - name: Read the five canonical route fields
        shell: bash
        run: |
          if [[ "${OWNER_CONFIRMATION}" != "M36-CL-03C-READ-ONLY" ]]; then
            echo "::error::Read-only confirmation did not match."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const records = [
            ['VK-GPIR-P-000000000003-4', '7FBD5IpsZutLF63MKuOntS'],
            ['VK-GPIR-P-000000000004-2', '2DHHp4k0GbZXcYvCFLoCPw'],
            ['VK-GPIR-P-000000000008-3', '6e0k5jOAGiEjj1iBKcNtVz'],
            ['VK-GPIR-P-000000000009-1', '2l3AdU2yAK87mANrSwZiej'],
            ['VK-GPIR-P-000000000011-7', '2XfDk3XcUCUtUzSQnx1f8l']
          ];
          const { CONTENTFUL_MANAGEMENT_TOKEN: token, CONTENTFUL_SPACE_ID: space,
            CONTENTFUL_ENVIRONMENT: environment } = process.env;
          if (!token || !space || !environment) {
            throw new Error('Required Contentful configuration is unavailable.');
          }
          const apiRoot = `https://api.contentful.com/spaces/${encodeURIComponent(space)}` +
            `/environments/${encodeURIComponent(environment)}/entries/`;
          const result = [];
          for (const [publicationId, contentfulEntryId] of records) {
            const response = await fetch(apiRoot + encodeURIComponent(contentfulEntryId), {
              method: 'GET',
              redirect: 'error',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/vnd.contentful.management.v1+json'
              }
            });
            if (!response.ok) {
              throw new Error(`Contentful GET failed with HTTP ${response.status} for ${contentfulEntryId}.`);
            }
            const entry = await response.json();
            const canonicalUrlCandidate = entry.fields?.canonicalUrlCandidate?.['en-US'];
            if (entry.sys?.id !== contentfulEntryId || typeof canonicalUrlCandidate !== 'string' ||
              !canonicalUrlCandidate.trim()) {
              throw new Error(`Contentful route readback is invalid for ${contentfulEntryId}.`);
            }
            result.push({ publicationId, contentfulEntryId, canonicalUrlCandidate });
          }
          process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
          NODE
