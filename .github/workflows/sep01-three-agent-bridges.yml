name: SEP-01 three-agent bridge acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sep01/agent-bridge.mjs'
      - 'scripts/sep01/agent-bridge.test.mjs'
      - 'scripts/sep01/three-agent-readiness.mjs'
      - '.github/workflows/sep01-three-agent-bridges.yml'
permissions:
  contents: read
jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fail-closed bridges
        run: node --test scripts/sep01/agent-bridge.test.mjs
      - name: Inventory host runner capability (not live authentication)
        run: node scripts/sep01/three-agent-readiness.mjs
