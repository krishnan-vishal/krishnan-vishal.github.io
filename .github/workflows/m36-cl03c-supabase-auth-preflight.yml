name: M36 CL-03C read-only Supabase authorization preflight

on:
  push:
    branches:
      - m36-cl03c-supabase-auth-preflight
    paths:
      - .github/workflows/m36-cl03c-supabase-auth-preflight.yml

permissions:
  contents: read

jobs:
  authorization-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: contentful-production
    env:
      GPIR_SUPABASE_SECRET_KEY: ${{ secrets.GPIR_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.GPIR_SUPABASE_DEPLOY_TOKEN }}
      SUPABASE_URL: https://qlnvhfapctcpzqyuhhth.supabase.co
      SUPABASE_PROJECT_REF: qlnvhfapctcpzqyuhhth
    steps:
      - name: Read role claims, table access, and database grants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const records = [
            ['ef992d9e-f2a6-4f65-94d2-ebec897c1339', 'VK-GPIR-P-000000000003-4'],
            ['1871bb85-709e-42bd-9cfd-f26e4688a7b7', 'VK-GPIR-P-000000000004-2'],
            ['2abed19a-3144-460d-a311-82f2ad9bad2f', 'VK-GPIR-P-000000000008-3'],
            ['754e2bcc-43f4-48de-8b7b-7d1f5da4c64a', 'VK-GPIR-P-000000000009-1'],
            ['1404ef1b-33f5-4b1f-98f0-c7535f71f3c9', 'VK-GPIR-P-000000000011-7']
          ];
          const roleClaim = token => {
            const parts = token.split('.');
            if (parts.length !== 3) return 'opaque-key-role-not-decodable';
            try {
              const role = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8')).role;
              return ['anon', 'authenticated', 'service_role'].includes(role) ? role : 'other-or-missing';
            } catch {
              return 'opaque-key-role-not-decodable';
            }
          };
          const readTable = async (token, table, query) => {
            const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/${table}?${query}`, {
              method: 'GET',
              redirect: 'error',
              headers: { apikey: token, authorization: `Bearer ${token}`, accept: 'application/json' }
            });
            if (!response.ok) return { httpStatus: response.status, rows: null };
            const data = await response.json();
            return { httpStatus: response.status, rows: Array.isArray(data) ? data.length : null };
          };
          const idFilter = `in.(${records.map(([id]) => id).join(',')})`;
          const identityQuery = new URLSearchParams({
            select: 'id,gpir_publication_id,identity_status,collision_state',
            id: idFilter
          });
          const policyQuery = new URLSearchParams({
            select: 'supabase_record_id,publication_id,access_class,status,classification_source,review_state,premium_plan_id',
            supabase_record_id: idFilter
          });
          const tokens = {
            configuredWorkflowKey: process.env.GPIR_SUPABASE_SECRET_KEY,
            standardServiceRoleKey: process.env.SUPABASE_SERVICE_ROLE_KEY
          };
          const rest = {};
          for (const [label, token] of Object.entries(tokens)) {
            if (!token) {
              rest[label] = { configured: false };
              continue;
            }
            rest[label] = {
              configured: true,
              jwtRoleClaim: roleClaim(token),
              identityRead: await readTable(token, 'gpir_identity_publications', identityQuery),
              policyRead: await readTable(token, 'gpir_publication_access_policies', policyQuery)
            };
          }

          const sql = `
            SELECT
              has_table_privilege('service_role', 'public.gpir_identity_publications', 'SELECT')
                AS identity_select,
              has_table_privilege('service_role', 'public.gpir_publication_access_policies', 'SELECT')
                AS policy_select,
              has_table_privilege('service_role', 'public.gpir_publication_access_policies', 'INSERT')
                AS policy_insert,
              has_table_privilege('service_role', 'public.gpir_publication_access_policies', 'UPDATE')
                AS policy_update,
              has_table_privilege('service_role', 'public.gpir_publication_access_policies', 'DELETE')
                AS policy_delete,
              (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.gpir_identity_publications'::regclass)
                AS identity_rls_enabled,
              (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.gpir_publication_access_policies'::regclass)
                AS policy_rls_enabled,
              (SELECT array_agg(column_name ORDER BY ordinal_position)
                 FROM information_schema.columns
                WHERE table_schema = 'public' AND table_name = 'gpir_publication_access_policies')
                AS policy_columns
          `;
          const management = { available: Boolean(process.env.SUPABASE_ACCESS_TOKEN) };
          if (management.available) {
            const response = await fetch(
              `https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/database/query`,
              {
                method: 'POST',
                redirect: 'error',
                headers: {
                  authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
                  'content-type': 'application/json',
                  accept: 'application/json'
                },
                body: JSON.stringify({ query: sql })
              });
            management.httpStatus = response.status;
            if (response.ok) {
              const result = await response.json();
              management.readOnlyPrivilegeQuery = Array.isArray(result) ? result[0] : result;
            }
          }
          process.stdout.write(`${JSON.stringify({ rest, management }, null, 2)}\n`);
          NODE
