name: M41 Payload governed publication proposal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: PREVIEW builds the site, RELEASE proposes a reviewed edition, and RECOVER synchronizes the live edition to Contentful.
        required: true
        default: PREVIEW
        type: choice
        options: [PREVIEW, RELEASE, RECOVER]
      snapshot:
        description: Exact reviewed Payload managed-site snapshot SHA-256 selected by the source lock
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpir-contentful-bcp
  cancel-in-progress: false

jobs:
  release:
    environment: ${{ inputs.mode == 'PREVIEW' && 'payload-preview' || 'payload-production-cutover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GPIR_CONTENT_SOURCE: payload
      GPIR_PAYLOAD_SITE_SNAPSHOT: ${{ inputs.snapshot }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
      PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
      GPIR_RELEASE_SIGNING_SECRET: ${{ secrets.GPIR_RELEASE_SIGNING_SECRET }}
      PAYLOAD_RELEASE_CUTOVER_ENABLED: ${{ vars.PAYLOAD_RELEASE_CUTOVER_ENABLED }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Require reviewed main and explicit publication configuration
        if: inputs.mode == 'RELEASE' || inputs.mode == 'RECOVER'
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$PAYLOAD_RELEASE_CUTOVER_ENABLED" = "true"
      - name: Require the live signed edition for recovery
        if: inputs.mode == 'RECOVER'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const snapshot = process.env.GPIR_PAYLOAD_SITE_SNAPSHOT;
            const lock = JSON.parse(fs.readFileSync('gpir-content-source.json', 'utf8'));
            if (!/^[a-f0-9]{64}$/.test(snapshot || '') ||
                lock.source !== 'payload' || lock.snapshot !== snapshot)
              throw Error('Recovery snapshot differs from the reviewed source lock.');
            const response = await fetch('https://fintechoisis.com/assets/data/cms-source.json', {
              redirect: 'error', signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw Error('Live Pages source marker is unavailable.');
            const live = await response.json();
            if (live.source !== 'payload' || live.snapshot !== snapshot)
              throw Error('Recovery snapshot differs from the live Pages edition.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Verify signed edition before advancing the protected source lock
        if: inputs.mode == 'RELEASE'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { client } = require('./scripts/m41/payload-site.cjs');
          (async () => {
            const snapshot = process.env.GPIR_PAYLOAD_SITE_SNAPSHOT;
            if (!/^[a-f0-9]{64}$/.test(snapshot || '')) throw Error('Invalid reviewed snapshot.');
            const current = JSON.parse(fs.readFileSync('gpir-content-source.json', 'utf8'));
            if (current.source !== 'payload' || !/^[a-f0-9]{64}$/.test(current.snapshot || ''))
              throw Error('Existing Payload source lock is invalid.');
            const source = await client(process.env);
            if (source.manifest.snapshot !== snapshot || source.manifest.parentSnapshot !== current.snapshot ||
                source.manifest.nativeResearch?.length !== 43)
              throw Error('Edition is not the reviewed 43-record successor to the current source lock.');
            // This changes only the ephemeral runner checkout. Production moves
            // after the generated edition PR is reviewed and merged.
            current.snapshot = snapshot;
            fs.writeFileSync('gpir-content-source.json', JSON.stringify(current, null, 2) + '\n');
            console.log('Signed 43-record edition verified; protected source lock staged for review.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Reconstruct full public content from the signed Payload snapshot
        if: inputs.mode != 'RECOVER'
        run: node scripts/build-cloudflare-preview.js
      - name: Validate and stage only the managed public edition
        if: inputs.mode == 'RELEASE'
        run: node scripts/m41/stage-pages-edition.cjs
      - name: Propose the edition through the existing reviewed Pages source
        if: inputs.mode == 'RELEASE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          edition_branch="automation/m41-payload-$GPIR_PAYLOAD_SITE_SNAPSHOT"
          if test -n "$(git ls-remote --heads origin "refs/heads/$edition_branch")"; then
            echo "Existing edition branch preserved. No reset, rewrite, or repeat publication."
            exit 0
          fi
          git switch -c "$edition_branch"
          git add --pathspec-from-file=.migration-data/m41-cutover/pages-stage-paths.nul --pathspec-file-nul
          git add -- gpir-content-source.json
          if git diff --cached --quiet; then
            echo "No managed publication change."
            exit 0
          fi
          git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "M41: stage reviewed Payload edition $GPIR_PAYLOAD_SITE_SNAPSHOT"
          git push origin "HEAD:refs/heads/$edition_branch"
          cat > "$RUNNER_TEMP/m41-publication-body.md" <<'BODY'
          Publish the complete signed Payload edition through the existing GitHub Pages source.
          Only managed public files and their release marker are staged. Engines and unrelated work are preserved.
          No DNS, domain, Pages source setting, Contentful, identity, entitlement, or database changes.
          Owner review and merge remain required; no production acceptance is claimed by this proposal.
          BODY
          gh pr create --base "$DEFAULT_BRANCH" --head "$edition_branch" --title "M41: publish reviewed Payload edition" --body-file "$RUNNER_TEMP/m41-publication-body.md"
      - name: Synchronize reviewed Payload edition to passive Contentful BCP
        if: inputs.mode == 'RELEASE' || inputs.mode == 'RECOVER'
        env:
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          GPIR_CONTENTFUL_BCP_WRITES_AUTHORIZED: 'true'
        id: bcp_sync
        run: node scripts/m41/sync-site-bcp.cjs
      - name: Retain authenticated BCP evidence
        if: steps.bcp_sync.outcome == 'success' && steps.bcp_sync.outputs.verified_records != ''
        uses: actions/upload-artifact@v4
        with:
          name: bcp-verified-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.bcp_sync.outputs.verified_records }}-${{ steps.bcp_sync.outputs.verified_epoch }}
          path: .migration-data/m41-bcp-recovery.json
          if-no-files-found: error
          retention-days: 90
      - name: Save the verified source and staging evidence
        if: always() && inputs.mode != 'RECOVER'
        uses: actions/upload-artifact@v4
        with:
          name: m41-full-site-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            .cloudflare-preview-dist/assets/data/cms-source.json
            .migration-data/m41-cutover/pages-stage-report.json
            .migration-data/m41-bcp-recovery.json
          if-no-files-found: warn
          retention-days: 7

