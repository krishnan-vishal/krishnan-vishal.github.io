name: M41 Payload governed publication proposal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: PREVIEW builds the full Payload site; RELEASE switches the existing website Worker.
        required: true
        default: PREVIEW
        type: choice
        options: [PREVIEW, RELEASE]
      snapshot:
        description: Exact reconciled Payload managed-site snapshot SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gpir-payload-governed-release
  cancel-in-progress: false

jobs:
  release:
    environment: ${{ inputs.mode == 'PREVIEW' && 'payload-preview' || 'payload-production-cutover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GPIR_CONTENT_SOURCE: payload
      GPIR_PAYLOAD_SITE_SNAPSHOT: ${{ inputs.snapshot }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
      PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
      GPIR_RELEASE_SIGNING_SECRET: ${{ secrets.GPIR_RELEASE_SIGNING_SECRET }}
      PAYLOAD_RELEASE_CUTOVER_ENABLED: ${{ vars.PAYLOAD_RELEASE_CUTOVER_ENABLED }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
      CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - name: Require explicit production source-switch configuration
        if: inputs.mode == 'RELEASE'
        run: test "$PAYLOAD_RELEASE_CUTOVER_ENABLED" = "true"
      - name: Reconstruct full public content from the signed Payload snapshot
        run: node scripts/build-cloudflare-preview.js
      - name: Synchronize Contentful BCP and verify actual remote recovery
        run: node scripts/m41/sync-site-bcp.cjs .migration-data/m41-bcp-recovery.json
      - name: Install pinned existing deployment tooling
        run: npm ci
        working-directory: apps/gpir-cms
      - name: Deploy full website through the existing Worker configuration
        if: inputs.mode == 'RELEASE'
        run: apps/gpir-cms/node_modules/.bin/wrangler deploy --config wrangler.jsonc
      - name: Verify the live Payload source and every migrated public file
        if: inputs.mode == 'RELEASE'
        run: node scripts/m41/verify-live.cjs .migration-data/m41-live-verification.json
      - name: Save consolidated release evidence
        uses: actions/upload-artifact@v4
        with:
          name: m41-full-site-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            .migration-data/m41-bcp-recovery.json
            .migration-data/m41-live-verification.json
            .cloudflare-preview-dist/assets/data/cms-source.json
          if-no-files-found: error
          retention-days: 7
