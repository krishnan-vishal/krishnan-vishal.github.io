name: SEP-01 routed Aider dispatch
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Previously approved OpenRouter coding model ID'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sep01-routed-aider-dispatch
  cancel-in-progress: false
jobs:
  routed-aider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated SEP-01 draft implementation
        uses: actions/checkout@v4
        with:
          ref: feat/sep01-central-command-controller-20261120
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Aider CLI
        run: python -m pip install 'aider-chat==0.86.1'
      - name: Automatically route approved Aider task and verify Git checkpoint
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEP01_AIDER_MODEL: ${{ inputs.model }}
          SEP01_AIDER_APPROVED: 'true'
          AIDER_ANALYTICS: 'false'
          AIDER_CHECK_UPDATE: 'false'
        run: node scripts/sep01/aider-routed-dispatch.mjs
