name: M43 Archive Regression
on:
  push:
    branches: [feat/m43-4a-google-drive-cloud-archive]
    paths:
      - 'scripts/m43/**'
      - '.github/workflows/m43-archive-regression.yml'
  pull_request:
    paths:
      - 'scripts/m43/**'
      - '.github/workflows/m43-archive-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Encryption and tamper rejection
        run: node scripts/m43/m43-drive-archive.cjs --self-test
      - name: Streaming and synthetic recovery
        run: node --test scripts/m43/m43-stream-archive.test.cjs scripts/m43/m43-production-archive.test.cjs

      - name: PostgreSQL 17 snapshot and isolated restore
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          docker run -d --name m43-fixture -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD=synthetic-only postgres:17
          trap 'docker rm -fv m43-fixture >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if docker exec m43-fixture pg_isready -U postgres; then break; fi
            sleep 1
          done
          export PGDATABASE=postgresql://postgres:synthetic-only@127.0.0.1:55432/postgres
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE public.fixture(id integer PRIMARY KEY, value text NOT NULL); INSERT INTO public.fixture VALUES (1,'alpha'),(2,'beta'); CREATE VIEW public.fixture_view AS SELECT * FROM public.fixture;"
          node - <<'NODE'
          const {exportNativePostgres,restorePostgresIsolated}=require('./scripts/m43/m43-production-archive.cjs');
          (async()=>{
            const backup=await exportNativePostgres({SUPABASE_DB_URL:process.env.PGDATABASE});
            const result=await restorePostgresIsolated(backup.file,backup.sourceManifest);
            if(result.status!=='ISOLATED_LOGICAL_RESTORE_VERIFIED')throw Error('Runtime recovery not verified');
            console.log('Synthetic PostgreSQL recovery passed');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
