name: SEP-01 controller acceptance
on:
  pull_request:
    paths:
      - 'scripts/sep01/**'
      - '.github/workflows/sep01-controller.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministic routing and failover acceptance
        run: node --test scripts/sep01/controller.test.mjs
