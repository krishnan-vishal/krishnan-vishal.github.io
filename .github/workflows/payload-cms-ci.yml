name: M41 Payload CMS validation

on:
  pull_request:
    paths:
      - 'apps/gpir-cms/**'
      - 'supabase/migrations/20261114020220_gpir_payload_schema_isolation.sql'
      - '.github/workflows/payload-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gpir-cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npx tsc --noEmit
      - name: Confirm schema push remains disabled
        run: node --test test/config-boundary.test.ts
