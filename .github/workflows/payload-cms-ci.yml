name: M41 Payload CMS validation
run-name: "${{ inputs.mode == 'REPAIR_MANAGEMENT' && format('M41 Management Repair {0}', inputs.recovery_id) || 'M41 Payload CMS validation' }}"

on:
  pull_request:
    paths:
      - 'apps/gpir-cms/**'
      - 'scripts/m41/**'
      - 'tests/m41/**'
      - 'scripts/build-cloudflare-preview.js'
      - 'gpir-content-source.json'
      - 'assets/data/cms-source.json'
      - 'supabase/functions/gpir-protected-publication/**'
      - 'supabase/functions/_shared/gpir-contentful-editorial.mjs'
      - 'supabase/migrations/20261114020220_gpir_payload_schema_isolation.sql'
      - '.github/workflows/payload-*.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: VALIDATE
        options: [VALIDATE, REPAIR_MANAGEMENT]
      recipient_public_key:
        type: string
        required: false
      recovery_id:
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'VALIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gpir-cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - run: npm ci
      - name: Apply and test temporary picomatch mitigation
        run: |
          node scripts/mitigate-picomatch.mjs
          node --test scripts/mitigate-picomatch.test.mjs
      - name: Verify fail-closed advisory policy
        run: node --test scripts/advisory-policy.test.mjs
      - name: Reject high and critical dependency findings
        run: npm audit --audit-level=high
      - run: npm run test
      - name: Verify existing-session release access
        run: node --test ../../tests/m41/release-access.test.mjs ../../tests/m41/management-session.test.mjs ../../tests/m41/import-checkpoint.test.mjs ../../tests/m41/payload-reader.test.cjs ../../tests/m41/website-resume.test.mjs ../../tests/m41/pages-staging.test.cjs
      - run: npx tsc --noEmit
      - name: Confirm schema push remains disabled
        run: node --test test/config-boundary.test.ts

  worker-build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'VALIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/gpir-cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - run: npm ci
      - name: Apply and test temporary picomatch mitigation
        run: |
          node scripts/mitigate-picomatch.mjs
          node --test scripts/mitigate-picomatch.test.mjs
      - name: Build isolated Cloudflare Worker
        run: npm run build:worker
        env:
          PAYLOAD_DATABASE_URI: postgresql://build_only:build_only@localhost:5432/postgres
          PAYLOAD_SECRET: build-only-placeholder-not-a-production-secret
          PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Confirm Worker entrypoint and assets
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Record compiled Worker security evidence
        run: node scripts/worker-build-evidence.mjs
      - name: Retain Worker artifact identity
        uses: actions/upload-artifact@v4
        with:
          name: gpir-worker-build-evidence
          path: ${{ runner.temp }}/gpir-worker-build-evidence.json
          if-no-files-found: error
          retention-days: 30

  repair-management:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'REPAIR_MANAGEMENT' &&
      github.actor == 'krishnan-vishal' &&
      github.repository == 'krishnan-vishal/krishnan-vishal.github.io' &&
      github.ref == 'refs/heads/fix/m41-cloudflare-sharp-admin-runtime-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify existing Core deployment credential and encrypt for owner workspace
        run: node scripts/m41/repair-management-access.mjs --seal --output="$RUNNER_TEMP/m41-management-session"
        env:
          GPIR_SUPABASE_DEPLOY_TOKEN: ${{ secrets.GPIR_SUPABASE_DEPLOY_TOKEN }}
          GPIR_RECOVERY_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          GPIR_RECOVERY_ID: ${{ inputs.recovery_id }}
      - name: Retain encrypted handoff only
        uses: actions/upload-artifact@v4
        with:
          name: m41-management-session-${{ inputs.recovery_id }}
          path: ${{ runner.temp }}/m41-management-session/management-envelope.json
          if-no-files-found: error
          retention-days: 1

