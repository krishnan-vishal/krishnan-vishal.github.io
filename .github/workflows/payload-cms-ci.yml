name: M41 Payload CMS validation
run-name: "${{ inputs.mode == 'REPAIR_MANAGEMENT' && format('M41 Management Repair {0}', inputs.recovery_id) || 'M41 Payload CMS validation' }}"

on:
  pull_request:
    paths:
      - 'apps/gpir-cms/**'
      - 'scripts/m41/**'
      - 'tests/m41/**'
      - 'scripts/build-cloudflare-preview.js'
      - 'gpir-content-source.json'
      - 'assets/data/cms-source.json'
      - 'supabase/functions/gpir-protected-publication/**'
      - 'supabase/functions/_shared/gpir-contentful-editorial.mjs'
      - 'supabase/migrations/20261114020220_gpir_payload_schema_isolation.sql'
      - '.github/workflows/payload-*.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: VALIDATE
        options: [VALIDATE, REPAIR_MANAGEMENT, CLASSIFY_CHAPTERS_DRY_RUN, CLASSIFY_AND_SYNC_BCP]
      recipient_public_key:
        type: string
        required: false
      recovery_id:
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'VALIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/gpir-cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - run: npm ci
      - name: Apply and test temporary picomatch mitigation
        run: |
          node scripts/mitigate-picomatch.mjs
          node --test scripts/mitigate-picomatch.test.mjs
      - name: Verify fail-closed advisory policy
        run: node --test scripts/advisory-policy.test.mjs
      - name: Enforce native audit and expiring advisory triage
        run: node scripts/verify-native-audit.mjs
      - name: Preserve native security audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpir-native-audit-evidence
          path: ${{ runner.temp }}/gpir-native-audit.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run test
      - name: Verify existing-session release access
        run: node --test ../../tests/m41/release-access.test.mjs ../../tests/m41/management-session.test.mjs ../../tests/m41/import-checkpoint.test.mjs ../../tests/m41/payload-reader.test.cjs ../../tests/m41/website-resume.test.mjs ../../tests/m41/pages-staging.test.cjs
      - run: npx tsc --noEmit
      - name: Confirm schema push remains disabled
        run: node --test test/config-boundary.test.ts

  worker-build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'VALIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/gpir-cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - run: npm ci
      - name: Apply and test temporary picomatch mitigation
        run: |
          node scripts/mitigate-picomatch.mjs
          node --test scripts/mitigate-picomatch.test.mjs
      - name: Build isolated Cloudflare Worker
        run: npm run build:worker
        env:
          PAYLOAD_DATABASE_URI: postgresql://build_only:build_only@localhost:5432/postgres
          PAYLOAD_SECRET: build-only-placeholder-not-a-production-secret
          PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Confirm Worker entrypoint and assets
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Record compiled Worker security evidence
        run: node scripts/worker-build-evidence.mjs
      - name: Inspect bundled Next picomatch exposure indicators
        run: node scripts/inspect-next-picomatch.mjs
      - name: Retain Next picomatch inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpir-next-picomatch-exposure
          path: ${{ runner.temp }}/gpir-next-picomatch-exposure.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain Worker artifact identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpir-worker-build-evidence
          path: ${{ runner.temp }}/gpir-worker-build-evidence.json
          if-no-files-found: warn
          retention-days: 30

  repair-management:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'REPAIR_MANAGEMENT' &&
      github.actor == 'krishnan-vishal' &&
      github.repository == 'krishnan-vishal/krishnan-vishal.github.io' &&
      github.ref == 'refs/heads/fix/m41-cloudflare-sharp-admin-runtime-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify existing Core deployment credential and encrypt for owner workspace
        run: node scripts/m41/repair-management-access.mjs --seal --output="$RUNNER_TEMP/m41-management-session"
        env:
          GPIR_SUPABASE_DEPLOY_TOKEN: ${{ secrets.GPIR_SUPABASE_DEPLOY_TOKEN }}
          GPIR_RECOVERY_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          GPIR_RECOVERY_ID: ${{ inputs.recovery_id }}
      - name: Retain encrypted handoff only
        uses: actions/upload-artifact@v4
        with:
          name: m41-management-session-${{ inputs.recovery_id }}
          path: ${{ runner.temp }}/m41-management-session/management-envelope.json
          if-no-files-found: error
          retention-days: 1


  classify-chapters:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'krishnan-vishal' &&
      github.repository == 'krishnan-vishal/krishnan-vishal.github.io' &&
      (github.ref == 'refs/heads/gpir/task1-money-movement-markets' || github.ref == 'refs/heads/main') &&
      (inputs.mode == 'CLASSIFY_CHAPTERS_DRY_RUN' || inputs.mode == 'CLASSIFY_AND_SYNC_BCP')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: payload-production-cutover
    concurrency:
      group: gpir-cms-chapter-classification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify configured credentials without printing values
        env:
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL || secrets.PAYLOAD_PUBLIC_SERVER_URL }}
          PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
          GPIR_RELEASE_SIGNING_SECRET: ${{ secrets.GPIR_RELEASE_SIGNING_SECRET }}
          GPIR_PAYLOAD_SITE_SNAPSHOT: ${{ vars.GPIR_PAYLOAD_SITE_SNAPSHOT || secrets.GPIR_PAYLOAD_SITE_SNAPSHOT }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          node -e 'const keys=["PAYLOAD_RELEASE_API_KEY","PAYLOAD_PUBLIC_SERVER_URL"]; if(process.env.MODE==="CLASSIFY_AND_SYNC_BCP") keys.push("GPIR_RELEASE_SIGNING_SECRET","GPIR_PAYLOAD_SITE_SNAPSHOT","CONTENTFUL_SPACE_ID","CONTENTFUL_ENVIRONMENT","CONTENTFUL_MANAGEMENT_TOKEN"); const missing=keys.filter(k=>!process.env[k]); if(missing.length){console.error("Missing configured settings: "+missing.join(", "));process.exit(1)}'
      - name: Resolve chapter identities and optionally apply
        env:
          PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL || secrets.PAYLOAD_PUBLIC_SERVER_URL }}
          MODE: ${{ inputs.mode }}
        run: |
          node scripts/m41/classify-money-movement-markets.cjs
          if [ "$MODE" = "CLASSIFY_AND_SYNC_BCP" ]; then
            node scripts/m41/classify-money-movement-markets.cjs --apply
          fi
      - name: Synchronize existing Contentful BCP and verify recovery
        if: inputs.mode == 'CLASSIFY_AND_SYNC_BCP'
        env:
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL || secrets.PAYLOAD_PUBLIC_SERVER_URL }}
          PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
          GPIR_RELEASE_SIGNING_SECRET: ${{ secrets.GPIR_RELEASE_SIGNING_SECRET }}
          GPIR_PAYLOAD_SITE_SNAPSHOT: ${{ vars.GPIR_PAYLOAD_SITE_SNAPSHOT || secrets.GPIR_PAYLOAD_SITE_SNAPSHOT }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          GPIR_CONTENTFUL_BCP_WRITES_AUTHORIZED: 'true'
        run: node scripts/m41/sync-site-bcp.cjs
