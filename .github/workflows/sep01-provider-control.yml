name: SEP-01 provider control tests
on:
  pull_request:
    paths:
      - 'scripts/sep01/**'
      - 'tests/sep01/**'
      - '.github/workflows/sep01-provider-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-provider-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deterministic failover and safe checkpointing
        run: python -m unittest discover -s tests/sep01 -p 'test_*.py' -v
