name: M40 Contentful editorial draft handoff

# Creates unpublished drafts in the selected primary CMS for source-verified T3
# candidates. The existing publisher and Supabase gates remain authoritative.
# Contentful remains intact as recovery storage after Payload cutover.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run lists planned drafts; sync creates or refreshes unpublished drafts'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - sync

permissions:
  contents: read

concurrency:
  group: m40-contentful-editorial-draft-handoff
  cancel-in-progress: false

jobs:
  draft-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: contentful-production
    env:
      GPIR_CONTENTFUL_READ_ONLY: 'true'
      GPIR_EDITORIAL_SOURCE: ${{ vars.GPIR_EDITORIAL_SOURCE }}
      PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
      PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
      SUPABASE_URL: https://qlnvhfapctcpzqyuhhth.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GPIR_SUPABASE_SECRET_KEY }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the handoff and the existing editorial publication contract
        run: >-
          node --test
          tests/m40/contentful-editorial-drafts.test.mjs
          tests/m39-t3-editorial-approval.test.mjs
      - name: Hand off eligible candidates to the primary CMS
        run: >-
          node scripts/m40/sync-contentful-editorial-drafts.mjs
          ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && '--dry-run' || '' }}
          --report=m40-draft-handoff-report.json
      - name: Upload credential-free handoff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m40-draft-handoff-report-${{ github.run_id }}
          path: m40-draft-handoff-report.json
          if-no-files-found: ignore
          retention-days: 14

  reconcile-bcp:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'krishnan-vishal/krishnan-vishal.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: payload-production-cutover
    concurrency:
      group: gpir-contentful-bcp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Reconcile existing passive Contentful recovery
        env:
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL || secrets.PAYLOAD_PUBLIC_SERVER_URL }}
          PAYLOAD_RELEASE_API_KEY: ${{ secrets.PAYLOAD_RELEASE_API_KEY }}
          GPIR_RELEASE_SIGNING_SECRET: ${{ secrets.GPIR_RELEASE_SIGNING_SECRET }}
          GPIR_PAYLOAD_SITE_SNAPSHOT: ${{ vars.GPIR_PAYLOAD_SITE_SNAPSHOT || secrets.GPIR_PAYLOAD_SITE_SNAPSHOT }}
          CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID || secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
          GPIR_CONTENTFUL_BCP_WRITES_AUTHORIZED: 'true'
        run: node scripts/m41/sync-site-bcp.cjs
      - name: Retain verified BCP receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m41-bcp-reconciliation-${{ github.run_id }}
          path: .migration-data/m41-bcp-recovery.json
          if-no-files-found: ignore
          retention-days: 14
