name: GPIR expert directory Payload deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpir-expert-cms-deploy.yml'
      - 'apps/gpir-cms/src/lib/domain-expert.*'
      - 'apps/gpir-cms/src/release/domain-expert-endpoint.ts'

permissions:
  contents: read

concurrency:
  group: gpir-payload-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: github.repository == 'krishnan-vishal/krishnan-vishal.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: payload-production-cutover
    steps:
      - name: Check out merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm Worker binding and release endpoint
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('apps/gpir-cms/wrangler.jsonc', 'utf8'));
          if(config.name !== 'gpir-payload-cms' || config.hyperdrive?.length !== 1 ||
             config.hyperdrive[0].binding !== 'HYPERDRIVE' ||
             config.hyperdrive[0].id !== '4398c601c5dc4e39bb2b35f76ff72845' ||
             config.hyperdrive[0].remote !== true)
            throw Error('Production Worker/Hyperdrive configuration changed; deployment refused');
          const payload = fs.readFileSync('apps/gpir-cms/src/payload.config.ts', 'utf8');
          if (!payload.includes('observatoryEditionEndpoint') || !payload.includes('domainExpertEndpoint'))
            throw Error('Required release endpoint absent');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/gpir-cms/package-lock.json
      - name: Install exact locked dependencies
        working-directory: apps/gpir-cms
        run: npm ci
      - name: Validate tests and types
        working-directory: apps/gpir-cms
        run: |
          npm test
          npx tsc --noEmit
      - name: Verify withdrawn advisory using GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /advisories/GHSA-fc5q-39xc-vjpf > "$RUNNER_TEMP/gpir-ghsa.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gpir-ghsa.json','utf8'));
          if(a.ghsa_id!=='GHSA-fc5q-39xc-vjpf' || !a.withdrawn_at || !Number.isFinite(Date.parse(a.withdrawn_at)))
            throw Error('Withdrawn advisory not independently confirmed; deployment refused');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gpir-withdrawn-verified',a.ghsa_id);
          console.log('Verified withdrawn GitHub advisory');
          NODE
      - name: Enforce release security policy
        working-directory: apps/gpir-cms
        run: |
          node scripts/verify-native-audit.mjs
          node --input-type=module -e "import fs from 'node:fs'; import {releaseDecision} from './scripts/advisory-policy.mjs'; const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gpir-native-audit.json','utf8')); const verified=fs.existsSync(process.env.RUNNER_TEMP+'/gpir-withdrawn-verified') && fs.readFileSync(process.env.RUNNER_TEMP+'/gpir-withdrawn-verified','utf8').trim()==='GHSA-fc5q-39xc-vjpf'; if(!['PASS','PASS_WITHDRAWN_ADVISORY'].includes(releaseDecision(report,Date.now(),verified))) { console.error('Production release blocked: native audit is not release-authorized.'); process.exit(1); }"
      - name: Build approved Worker
        working-directory: apps/gpir-cms
        run: npm run build:worker
        env:
          PAYLOAD_DATABASE_URI: postgresql://build_only:build_only@localhost:5432/postgres
          PAYLOAD_SECRET: build-only-placeholder-not-a-production-secret
          PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Verify Worker artifact
        working-directory: apps/gpir-cms
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          node scripts/worker-build-evidence.mjs
          node scripts/inspect-next-picomatch.mjs
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gpir-next-picomatch-exposure.json','utf8')); if(p.compiledPicomatch || p.staticReferenceFiles?.length) { console.log('Bundled picomatch retained as evidence; withdrawn advisory GHSA-fc5q-39xc-vjpf reviewed 2026-11-18. Other active findings remain blocked by native audit.'); }"
      - name: Deploy to existing Cloudflare Worker
        working-directory: apps/gpir-cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Protected Cloudflare deployment configuration unavailable"; exit 1; }
          npx wrangler deploy --config wrangler.jsonc
      - name: Confirm deployed endpoint exists without exposing credentials
        env:
          PAYLOAD_PUBLIC_SERVER_URL: ${{ vars.PAYLOAD_PUBLIC_SERVER_URL }}
        run: |
          test -n "$PAYLOAD_PUBLIC_SERVER_URL"
          for endpoint in observatory-edition domain-expert; do
            status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' -X POST "${PAYLOAD_PUBLIC_SERVER_URL%/}/api/release/$endpoint" -H 'content-type: application/json' -d '{}')
            test "$status" = "403" || { echo "Endpoint $endpoint returned HTTP $status instead of 403"; exit 1; }
          done
