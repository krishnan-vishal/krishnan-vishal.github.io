name: M39 FX Contentful governed batch preflight
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Read-only governed CMS verification (publication writes are not enabled)'
        required: true
        default: 'verify'
        type: choice
        options:
          - verify
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: contentful-production
    env:
      CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only governed CMS batch preflight
        run: node scripts/m39/fx-contentful-batch-preflight.cjs
