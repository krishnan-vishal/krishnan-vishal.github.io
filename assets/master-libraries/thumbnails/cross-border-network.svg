
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<style>
body{font-family:Arial}
.h{fill:#0F2747}
.gold{fill:#D4AF37}
.title{font:700 34px Arial;fill:#0F2747}
.sub{font:18px Arial;fill:#666}
.box{fill:#fff;stroke:#58708a;stroke-width:2;rx:12}
.rail{stroke-width:5;fill:none}
.lbl{font:700 18px Arial;fill:#0F2747}
.txt{font:15px Arial;fill:#333}
.small{font:14px Arial;fill:#666}
</style>

<rect width="1920" height="1080" fill="#F7F8FA"/>
<rect width="1920" height="90" class="h"/>
<text x="50" y="55" fill="white" font-size="24" font-family="Arial" font-weight="700">
GPIR • Global Payments Intelligence Repository
</text>

<text x="50" y="145" class="title">Cross-Border Payments Network Architecture</text>
<text x="50" y="175" class="sub">Version 1.0 • Executive Reference Diagram</text>

