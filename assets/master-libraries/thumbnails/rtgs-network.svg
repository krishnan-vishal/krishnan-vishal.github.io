
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<style>
.title{font:700 34px Arial;fill:#0F2747}
.sub{font:18px Arial;fill:#666}
.head{font:700 24px Arial;fill:#fff}
