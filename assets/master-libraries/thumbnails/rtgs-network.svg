.txt{font:15px Arial;fill:#333}
.box{fill:#fff;stroke:#60758a;stroke-width:2;rx:12}
</style>

<rect width="1920" height="1080" fill="#F7F9FB"/>
<rect width="1920" height="90" fill="#0F2747"/>
<text x="50" y="56" class="head">GPIR • Global Payments Intelligence Repository</text>

