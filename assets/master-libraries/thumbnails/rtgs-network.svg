<rect x="790" y="260" width="340" height="150" fill="#D4AF37" stroke="#8c6b00" stroke-width="2" rx="12"/>
<text x="865" y="315" class="lbl">Central Bank RTGS</text>
<text x="850" y="345" class="txt">Settlement Engine</text>
<text x="860" y="370" class="txt">Liquidity Queue</text>

<rect x="1270" y="300" width="220" height="70" class="box"/>
