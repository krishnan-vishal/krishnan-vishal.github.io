<line x1="300" y1="335" x2="430" y2="335"/>
<line x1="650" y1="335" x2="790" y2="335"/>
<line x1="1130" y1="335" x2="1270" y2="335"/>
<line x1="1490" y1="335" x2="1620" y2="335"/>
</g>

<rect x="70" y="500" width="1770" height="70" fill="#E7F4FF" stroke="#60758a"/>
<text x="110" y="542" class="lbl">Payment Initiation → Validation → Settlement → Finality</text>

<rect x="70" y="620" width="560" height="300" class="box"/>
<text x="90" y="660" class="lbl">Major RTGS Systems</text>
<text x="90" y="700" class="txt">• Fedwire</text>
