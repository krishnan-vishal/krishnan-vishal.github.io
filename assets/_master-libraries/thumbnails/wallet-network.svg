.head{font:700 24px Arial;fill:#fff}
.lbl{font:700 18px Arial;fill:#0F2747}
.txt{font:15px Arial;fill:#333}
.box{fill:#fff;stroke:#5e7389;stroke-width:2;rx:12}
</style>

<rect class="bg" width="1920" height="1080"/>
<rect class="navy" width="1920" height="90"/>
<text x="50" y="56" class="head">GPIR • Global Payments Intelligence Repository</text>

