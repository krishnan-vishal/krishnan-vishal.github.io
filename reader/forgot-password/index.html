<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/assets/css/reader-auth.css">
<script src="/assets/js/gpir-supabase-public-config.js"></script>

<body><a class="skip-link" href="#reader-auth-main">Skip to recovery</a>
<main class="reader-auth-shell" id="reader-auth-main"><a class="reader-auth-brand" href="/">FINTECHOISIS <span>GPIR</span></a>
<section class="reader-auth-card"><p class="reader-auth-kicker">Reader account recovery</p><h1>Reset your password</h1>

<p class="reader-auth-switch"><a href="/reader/sign-in/">Return to sign in</a></p></section></main></body></html>
